<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LightBox Galeri Örneği</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="css/lightbox.min.css">
  </head>
  <body>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <a class="example-image-link" href="https://picsum.photos/id/237/600/900" data-lightbox="example-set" ><img class=" img-fluid example-image" src="https://picsum.photos/id/237/200/300"></a>
            </div>
            <div class="col-md-3">
                <a class="example-image-link" href="https://picsum.photos/seed/picsum/600/900" data-lightbox="example-set" ><img class=" img-fluid example-image" src="https://picsum.photos/seed/picsum/200/300"></a>
            </div>
            <div class="col-md-3">
                <a class="example-image-link" href="https://picsum.photos/600/900/?blur" data-lightbox="example-set" ><img class=" img-fluid example-image" src="https://picsum.photos/200/300/?blur"></a>
            </div>
            <div class="col-md-3">
                <a class="example-image-link" href="https://picsum.photos/600/900.jpg" data-lightbox="example-set" ><img class=" img-fluid example-image" src="https://picsum.photos/600/900.jpg"></a>
            </div>
        </div>
    </div>




    <script src="js/lightbox-plus-jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
